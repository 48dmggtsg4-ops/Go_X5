basePath: /api/v1
definitions:
  httpapi.CreateOrderRequest:
    properties:
      customer:
        example: Алиса
        minLength: 1
        type: string
    required:
    - customer
    type: object
  httpapi.ErrorResponse:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      error:
        example: customer is required
        type: string
    required:
    - code
    - error
    type: object
  httpapi.OrderResponse:
    properties:
      customer:
        example: Алиса
        type: string
      id:
        example: 1
        minimum: 1
        type: integer
      status:
        enum:
        - new
        - cancelled
        example: new
        type: string
    required:
    - customer
    - id
    - status
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  description: Учебный контракт сервиса заказов. Данные находятся в памяти и исчезают
    после перезапуска. GET-маршруты ServeMux также принимают HEAD. Ошибки под /api/v1/
    имеют формат {error,code}, в том числе неизвестный маршрут (404 ROUTE_NOT_FOUND)
    и неподдерживаемый метод (405 METHOD_NOT_ALLOWED и заголовок Allow). Swagger UI
    доступен локально на /swagger/index.html.
  title: Orders API
  version: "1.0"
paths:
  /orders:
    get:
      description: 'Сортировка id по возрастанию. Фильтр применяется до пагинации.
        Пустая страница: []. Доступны статусы new и cancelled, но это демо создаёт
        только new, поэтому фильтр cancelled возвращает []. Неизвестные и повторные
        query-параметры запрещены. Числа передаются десятичными цифрами.'
      parameters:
      - default: 20
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Статус заказа
        enum:
        - new
        - cancelled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.OrderResponse'
            type: array
        "400":
          description: INVALID_QUERY
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "405":
          description: METHOD_NOT_ALLOWED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Список заказов
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: 'Имя клиента обрезается по краям и должно содержать непробельные
        символы. Тело: один JSON-объект, только customer, не более 1024 байт. Повторные
        заказы клиента разрешены. Сервер назначает id и status=new. Неизвестные поля
        и null запрещены.'
      parameters:
      - description: Данные заказа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Относительный URI созданного заказа, например /api/v1/orders/1
              type: string
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: INVALID_JSON или VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "405":
          description: METHOD_NOT_ALLOWED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: BODY_TOO_LARGE
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Создать заказ
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: Положительный номер заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: INVALID_ID
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: ORDER_NOT_FOUND
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "405":
          description: METHOD_NOT_ALLOWED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Получить заказ по номеру
      tags:
      - orders
  /status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
        "405":
          description: METHOD_NOT_ALLOWED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Статус учебного сервиса
      tags:
      - status
swagger: "2.0"
